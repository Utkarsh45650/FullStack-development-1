<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .form {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 97vh;
            width: 100%;
        }
        form {
            width: auto;
            height: auto;
            border: 2px solid rgb(96, 139, 168);
            padding: 20px;
            border-radius: 10px;
            background-color: rgb(96, 139, 168, 0.2);
            line-height: 1.5;
            box-shadow: -12px 13px 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="form">
        <form>
            <h1>Login</h1><br>
            Username:<br>
            <input type="text" placeholder="username"><br>
            Password:<br>
            <input type="password" placeholder="password"><br>
            <button>Login</button>
        </form>
    </div>
</body>
</html>
