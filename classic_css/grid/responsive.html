<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: grid;
            align-items: center;
            justify-content: center;
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr;
            height: auto;
            width: 100%;
            grid-template-areas:
            "box1 box1 box1 box1 box1 box1 box1 box1"
            "box2 box2 box3 box3 box4 box4 box5 box5"
            "box2 box2 box6 box6 box7 box7 box8 box8"
            "box2 box2 box9 box9 box9 box10 box10 box10"
            "box2 box2 box9 box9 box9 box10 box10 box10"
            "box11 box11 box11 box11 box11 box11 box11 box11";
            gap: 10px
        }
        .container .box {
            border-radius: 5px;
            border: 1px solid black;
            display:grid;
            align-items: center;
            justify-content: center;
            min-height: 70px;
        }
    </style>
</head>
<body>
    <div class="container">
            <div class="box" style="grid-area: box1; background-color:aqua"><p>HEADER</p></div>
            <div class="box" style="grid-area: box2; background-color:coral"><p>SIDEBAR</p></div>
            <div class="box" style="grid-area: box3; background-color:aquamarine"><p>STAT</p></div>
            <div class="box" style="grid-area: box4; background-color:aquamarine"><p>STAT</p></div>
            <div class="box" style="grid-area: box5; background-color:aquamarine"><p>STAT</p></div>
            <div class="box" style="grid-area: box6; background-color:aquamarine"><p>STAT</p></div>
            <div class="box" style="grid-area: box7; background-color:aquamarine"><p>STAT</p></div>
            <div class="box" style="grid-area: box8; background-color:aquamarine"><p>STAT</p></div>
            <div class="box" style="grid-area: box9; background-color:bisque"><p>RECENT ORDER</p></div>
            <div class="box" style="grid-area: box10; background-color:bisque"><p>ACTIVITY</p></div>
            <div class="box" style="grid-area: box11; background-color:lightgray"><p>FOOTER</p></div>
    </div>
</body>
</html>
